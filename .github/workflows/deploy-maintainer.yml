name: Deploy selected ref to maintainer server

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit SHA to build and deploy
        required: true
        default: main
        type: string

concurrency:
  group: maintainer-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEPLOY_SOURCE_REF: ${{ inputs.source_ref }}
      MAINTAINER_DEPLOY_RESTART_COMMAND: ${{ vars.MAINTAINER_DEPLOY_RESTART_COMMAND }}
      MAINTAINER_DEPLOY_SSH_HOST: ${{ vars.MAINTAINER_DEPLOY_SSH_HOST }}
      MAINTAINER_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.MAINTAINER_DEPLOY_SSH_KNOWN_HOSTS }}
      MAINTAINER_DEPLOY_SSH_USER: ${{ vars.MAINTAINER_DEPLOY_SSH_USER }}
    steps:
      - name: Checkout selected ref
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Record selected revision
        shell: bash
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"
          echo "IMAGE_REF=stage-flow-tools:deploy-$deploy_sha" >> "$GITHUB_ENV"
          echo "IMAGE_ARCHIVE=$RUNNER_TEMP/stage-flow-tools-$deploy_sha.tar.gz" >> "$GITHUB_ENV"
          echo "REMOTE_ARCHIVE=/tmp/stage-flow-tools-$deploy_sha.tar.gz" >> "$GITHUB_ENV"
          echo "Deploying $DEPLOY_SOURCE_REF revision $deploy_sha"

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=$DEPLOY_SHA" \
            --tag "$IMAGE_REF" \
            .

      - name: Smoke-test Docker image
        shell: bash
        run: |
          set -euo pipefail
          container_name=stage-flow-tools-maintainer-smoke
          docker run --detach --name "$container_name" --publish 127.0.0.1:3000:3000 "$IMAGE_REF"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/questions/active >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          exit 1

      - name: Remove smoke-test container
        if: always()
        shell: bash
        run: docker rm --force stage-flow-tools-maintainer-smoke || true

      - name: Create Docker image archive
        shell: bash
        run: |
          set -euo pipefail
          docker image save "$IMAGE_REF" | gzip --stdout > "$IMAGE_ARCHIVE"
          image_archive_sha256="$(sha256sum "$IMAGE_ARCHIVE" | awk '{print $1}')"
          test -n "$image_archive_sha256"
          echo "IMAGE_ARCHIVE_SHA256=$image_archive_sha256" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          MAINTAINER_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.MAINTAINER_DEPLOY_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for variable_name in \
            MAINTAINER_DEPLOY_RESTART_COMMAND \
            MAINTAINER_DEPLOY_SSH_HOST \
            MAINTAINER_DEPLOY_SSH_KNOWN_HOSTS \
            MAINTAINER_DEPLOY_SSH_PRIVATE_KEY \
            MAINTAINER_DEPLOY_SSH_USER; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing GitHub Actions configuration: $variable_name" >&2
              exit 1
            fi
          done

          ssh_directory="$RUNNER_TEMP/stage-flow-deploy-ssh"
          install -d -m 700 "$ssh_directory"
          printf '%s\n' "$MAINTAINER_DEPLOY_SSH_PRIVATE_KEY" > "$ssh_directory/id_ed25519"
          printf '%s\n' "$MAINTAINER_DEPLOY_SSH_KNOWN_HOSTS" > "$ssh_directory/known_hosts"
          chmod 600 "$ssh_directory/id_ed25519" "$ssh_directory/known_hosts"
          echo "SSH_DIRECTORY=$ssh_directory" >> "$GITHUB_ENV"

      - name: Transfer and deploy Docker image
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -F /dev/null
            -i "$SSH_DIRECTORY/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_DIRECTORY/known_hosts"
          )
          ssh_target="$MAINTAINER_DEPLOY_SSH_USER@$MAINTAINER_DEPLOY_SSH_HOST"
          restart_command_base64="$(printf '%s' "$MAINTAINER_DEPLOY_RESTART_COMMAND" | base64 --wrap=0)"

          ssh "${ssh_options[@]}" "$ssh_target" bash -s -- "$restart_command_base64" <<'REMOTE_PREFLIGHT'
          set -euo pipefail

          restart_command_base64="$1"
          test -n "$restart_command_base64"
          command -v bash >/dev/null
          command -v base64 >/dev/null
          restart_command="$(printf '%s' "$restart_command_base64" | base64 --decode)"
          test -n "$restart_command"
          command -v docker >/dev/null
          command -v gzip >/dev/null
          command -v sha256sum >/dev/null
          docker info >/dev/null
          bash -n -c "$restart_command"
          REMOTE_PREFLIGHT

          scp "${ssh_options[@]}" "$IMAGE_ARCHIVE" "$ssh_target:$REMOTE_ARCHIVE"

          ssh "${ssh_options[@]}" "$ssh_target" bash -s -- \
            "$REMOTE_ARCHIVE" \
            "$IMAGE_REF" \
            "$DEPLOY_SHA" \
            "$IMAGE_ARCHIVE_SHA256" \
            "$restart_command_base64" <<'REMOTE_DEPLOY'
          set -euo pipefail

          archive_path="$1"
          image_ref="$2"
          deploy_sha="$3"
          expected_archive_sha256="$4"
          restart_command_base64="$5"
          test -n "$expected_archive_sha256"
          test -n "$restart_command_base64"
          command -v base64 >/dev/null
          command -v sha256sum >/dev/null
          restart_command="$(printf '%s' "$restart_command_base64" | base64 --decode)"
          test -n "$restart_command"

          trap 'rm -f "$archive_path"' EXIT
          loaded_archive_sha256="$(sha256sum "$archive_path" | awk '{print $1}')"
          if [[ "$loaded_archive_sha256" != "$expected_archive_sha256" ]]; then
            echo "Deployment archive checksum mismatch." >&2
            echo "Expected archive checksum: $expected_archive_sha256" >&2
            echo "Loaded archive checksum: $loaded_archive_sha256" >&2
            exit 1
          fi
          gzip --decompress --stdout "$archive_path" | docker image load

          loaded_image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
          loaded_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")"
          if [[ "$loaded_revision" != "$deploy_sha" ]]; then
            echo "Loaded image revision does not match the selected revision." >&2
            echo "Expected revision: $deploy_sha" >&2
            echo "Loaded revision: $loaded_revision" >&2
            exit 1
          fi

          docker image tag "$image_ref" stage-flow-tools:latest
          loaded_latest_image_id="$(docker image inspect --format '{{.Id}}' stage-flow-tools:latest)"
          if [[ "$loaded_latest_image_id" != "$loaded_image_id" ]]; then
            echo "Latest tag does not reference the verified deployment image." >&2
            echo "Deployment image ID: $loaded_image_id" >&2
            echo "Latest image ID: $loaded_latest_image_id" >&2
            exit 1
          fi

          bash -o errexit -o nounset -o pipefail -c "$restart_command"
          REMOTE_DEPLOY

      - name: Remove remote deployment archive
        if: always()
        shell: bash
        run: |
          ssh_directory="${SSH_DIRECTORY:-}"
          remote_archive="${REMOTE_ARCHIVE:-}"

          if [[ "$ssh_directory" != "$RUNNER_TEMP/stage-flow-deploy-ssh" || ! -f "$ssh_directory/id_ed25519" || ! -f "$ssh_directory/known_hosts" || "$remote_archive" != /tmp/stage-flow-tools-*.tar.gz ]]; then
            exit 0
          fi

          ssh_options=(
            -F /dev/null
            -i "$ssh_directory/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_directory/known_hosts"
          )
          ssh_target="$MAINTAINER_DEPLOY_SSH_USER@$MAINTAINER_DEPLOY_SSH_HOST"
          ssh "${ssh_options[@]}" "$ssh_target" rm -f -- "$remote_archive" || true

      - name: Remove deployment artifacts
        if: always()
        shell: bash
        run: |
          archive_path="${IMAGE_ARCHIVE:-}"
          ssh_directory="${SSH_DIRECTORY:-}"

          case "$archive_path" in
            "$RUNNER_TEMP"/stage-flow-tools-*.tar.gz) rm -f -- "$archive_path" ;;
          esac
          if [[ "$ssh_directory" == "$RUNNER_TEMP/stage-flow-deploy-ssh" ]]; then
            rm -rf -- "$ssh_directory"
          fi

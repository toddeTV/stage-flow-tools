name: Docker Smoke Test

on:
  workflow_call:
    inputs:
      release_sha:
        description: SHA created by Release Please
        required: true
        type: string
      release_tag:
        description: Release tag whose package version is embedded in the image
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional release SHA to smoke-test; defaults to this workflow run's SHA
        required: false
        type: string
      release_tag:
        description: Optional release tag; a smoke identifier is embedded when omitted
        required: false
        type: string

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Derive embedded application version
        id: embedded-version
        env:
          RELEASE_TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG_NAME" ]; then
            package_version="$(jq --raw-output '.version' package.json)"
            test "$RELEASE_TAG_NAME" = "v$package_version"
            build_version="$package_version"
          else
            build_version="$(date --utc +%F)-smoke-$(git rev-parse --short=7 HEAD)"
          fi
          echo "version=$build_version" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: >-
          docker build
          --build-arg "STAGE_FLOW_BUILD_VERSION=${{ steps.embedded-version.outputs.version }}"
          --tag stage-flow-tools:smoke .

      - name: Start image and wait for the public API
        run: |
          docker run --detach --name stage-flow-tools-smoke --publish 127.0.0.1:3000:3000 stage-flow-tools:smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/questions/active >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs stage-flow-tools-smoke
          exit 1

      - name: Show container logs after failure
        if: failure()
        run: docker logs stage-flow-tools-smoke || true

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force stage-flow-tools-smoke || true

allowBuilds:
  "@parcel/watcher": false
  better-sqlite3: false
  esbuild: false
  unrs-resolver: false

catalog:
  eslint: ~10.10.0

  # vite-plus ecosystem packages only; Nuxt must keep resolving upstream `vite`
  vite-plus: ~0.3.1

minimumReleaseAgeExclude:
  - autoprefixer@10.5.6
  - "@iconify/collections@1.0.735"
  - "@napi-rs/wasm-runtime@1.2.4"
  - devframe@0.9.18
  - electron-to-chromium@1.5.426
  - magic-string@1.3.1
  - vite@8.3.0
  - whatwg-url@17.1.1

saveDev: true

savePrefix: "~"

shamefullyHoist: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080
